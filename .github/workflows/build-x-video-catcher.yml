name: Build X Video Catcher APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release and upload APK'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'projects/x-video-catcher/**'
      - '.github/workflows/build-x-video-catcher.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/x-video-catcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare project for CI
        run: |
          rm -f local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties || true
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify Xposed module contract in APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apk=$APK build-tools=$BT"
          # The framework loads the module by the class named in assets/xposed_init.
          # A missing or misspelled entry means LSPosed silently ignores the module.
          ENTRY=$(unzip -p "$APK" assets/xposed_init | tr -d '\r\n')
          test "$ENTRY" = "com.jiesa.xvideocatcher.XVideoCatcherModule"
          # xposedminversion is what marks this as a legacy module to LSPosed.
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'xposedminversion'
          # The Xposed API must stay provided-only; a bundled copy breaks hooking.
          unzip -l "$APK" | grep -q 'classes.dex'
          test -z "$(unzip -l "$APK" | grep -i 'de/robv/android/xposed' || true)"
          echo "module contract OK: entry=$ENTRY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: x-video-catcher-debug-apk
          path: projects/x-video-catcher/app/build/outputs/apk/debug/*.apk

      - name: Generate release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          echo "RELEASE_TAG=x-video-catcher-$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: X Video Catcher ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: projects/x-video-catcher/app/build/outputs/apk/debug/*.apk
