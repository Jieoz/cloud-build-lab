name: Build Rimet Mock APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release and upload APK'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'projects/rimet-mock/**'
      - '.github/workflows/build-rimet-mock.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/rimet-mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project for CI
        run: |
          rm -f local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties || true
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify libxposed module contract in APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apk=$APK build-tools=$BT"
          # framework loads the module by the class named here; a typo = silent no-op
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')
          test "$ENTRY" = "com.jieoz.rimetmock.RimetMockModule"
          PROP=$(unzip -p "$APK" META-INF/xposed/module.prop)
          printf '%s\n' "$PROP" | grep -qx 'minApiVersion=102'
          printf '%s\n' "$PROP" | grep -qx 'staticScope=true'
          SCOPE=$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')
          echo "$SCOPE" | grep -q 'com.alibaba.android.rimet'
          # legacy entry/prefs must be gone
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then
            echo "::error::legacy assets/xposed_init survived packaging"; exit 1
          fi
          # the module must NOT bundle the libxposed API (framework provides it)
          if unzip -l "$APK" | grep -qE 'io/github/libxposed/api/XposedModule'; then
            echo "::error::libxposed api bundled into APK"; exit 1
          fi
          # and must NOT bundle any AMap SDK — the whole point of the rewrite
          if unzip -l "$APK" | grep -qE 'com/amap/api/'; then
            echo "::error::AMap SDK bundled into APK"; exit 1
          fi
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          if grep -E 'xposedmodule|xposedsharedprefs|xposedminversion' /tmp/manifest.txt; then
            echo "::error::legacy xposed meta-data survived packaging"; exit 1
          fi
          echo "libxposed contract OK: $ENTRY minApiVersion=102 scope=$SCOPE (no AMap SDK, no api bundle)"

      - name: Record signer
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/signer.txt
          grep -m1 -i 'certificate SHA-256 digest' /tmp/signer.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rimet-mock-debug-apk
          path: projects/rimet-mock/app/build/outputs/apk/debug/*.apk

      - name: Generate release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          echo "RELEASE_TAG=rimet-mock-$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Rimet Mock ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: projects/rimet-mock/app/build/outputs/apk/debug/*.apk
