name: Build MotoChargeBoostToggle APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release and upload APK'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'projects/moto-chargeboost-toggle/**'
      - '.github/workflows/build-moto-chargeboost-toggle.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/moto-chargeboost-toggle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare project for CI
        run: |
          rm -f local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties || true
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.XVC_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::keystore secret missing; refusing an un-upgradable APK"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build debug APK
        env:
          MOTO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MOTO_KEYSTORE_PASSWORD: ${{ secrets.XVC_KEYSTORE_PASSWORD }}
          MOTO_KEY_ALIAS: ${{ secrets.XVC_KEY_ALIAS }}
          MOTO_KEY_PASSWORD: ${{ secrets.XVC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature is the fixed key
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 -i 'certificate SHA-256 digest' | sed -E 's/.*digest: *//' | tr 'A-Z' 'a-z')
          EXPECTED=1815c41d47083714332df8399f97d4abcaad8803f7a7d6b1aed25507491b8d2d
          echo "signer=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {{ echo "::error::not the fixed key ($ACTUAL)"; exit 1; }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-chargeboost-toggle-debug-apk
          path: projects/moto-chargeboost-toggle/app/build/outputs/apk/debug/*.apk

      - name: Generate release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          echo "RELEASE_TAG=moto-chargeboost-toggle-$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MotoChargeBoostToggle ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: projects/moto-chargeboost-toggle/app/build/outputs/apk/debug/*.apk

      - name: Prune old releases (keep latest 8)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const realReleases = releases
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = realReleases.slice(8);
            for (const rel of toDelete) {
              if (rel.tag_name) {
                core.info(`Deleting release ${rel.id} tag ${rel.tag_name}`);
                await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${rel.tag_name}` });
              }
            }
