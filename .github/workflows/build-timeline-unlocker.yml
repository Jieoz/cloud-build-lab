name: Build Timeline Unlocker APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release and upload APK'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'projects/timeline-unlocker/**'
      - '.github/workflows/build-timeline-unlocker.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/timeline-unlocker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare project for CI
        run: |
          rm -f local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties || true
          test -f settings.gradle.kts
          test -f xposed/build.gradle.kts
          test -f xposed/src/main/java/io/github/timeline_unlocker/xposed/MainHook.java
          test -f xposed/src/main/java/io/github/timeline_unlocker/xposed/DiagLog.java
          test -f xposed/src/main/java/io/github/timeline_unlocker/xposed/LogExportActivity.java

      - name: Restore signing keystore
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_B64: ${{ secrets.XVC_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::XVC_KEYSTORE_B64 secret is missing; refusing to build an APK that cannot be upgraded in place"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build debug APK
        working-directory: projects/timeline-unlocker
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.XVC_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.XVC_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.XVC_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
        run: chmod +x ./gradlew && ./gradlew --no-daemon :xposed:testDebugUnitTest :xposed:assembleDebug

      - name: Dump failing test details
        if: failure()
        run: |
          for f in xposed/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  print(f"--- {case.get('classname')}.{case.get('name')}")
                  print((bad.text or bad.get('message') or '').strip()[:2000])
          PY
          done

      - name: Verify module contract
        if: success() || failure()
        working-directory: projects/timeline-unlocker
        run: |
          set -euo pipefail
          APK=$(ls xposed/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apk=$APK bytes=$(stat -c%s "$APK")"
          echo "---- java_init.list ----"
          unzip -p "$APK" META-INF/xposed/java_init.list || true
          echo "---- module.prop ----"
          unzip -p "$APK" META-INF/xposed/module.prop || true
          echo "---- scope.list ----"
          unzip -p "$APK" META-INF/xposed/scope.list || true
          echo "---- classes ----"
          unzip -l "$APK" | grep 'timeline_unlocker' || true
          echo "---- badging ----"
          "$BT/aapt" dump badging "$APK" | head -5 || true
          test "$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')" = "io.github.timeline_unlocker.xposed.MainHook"
          test "$(unzip -p "$APK" META-INF/xposed/module.prop | grep -c '^minApiVersion=102')" = "1"
          unzip -p "$APK" META-INF/xposed/scope.list | grep -q 'com.google.android.apps.maps'
          unzip -l "$APK" | grep -q 'LogExportActivity'
          unzip -l "$APK" | grep -q 'DiagLog'
          "$BT/aapt" dump badging "$APK" | grep -q "io.github.timeline_unlocker.xposed"
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 -i 'certificate SHA-256 digest' | sed -E 's/.*digest: *//' | tr 'A-Z' 'a-z' | tr -d ':')
          EXPECTED=1815c41d47083714332df8399f97d4abcaad8803f7a7d6b1aed25507491b8d2d
          echo "cert=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "module contract OK"

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-unlocker-debug-apk
          path: projects/timeline-unlocker/xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
