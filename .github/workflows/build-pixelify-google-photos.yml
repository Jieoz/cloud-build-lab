name: Build Pixelify Google Photos APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release and upload APK'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'projects/pixelify-google-photos/**'
      - '.github/workflows/build-pixelify-google-photos.yml'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/pixelify-google-photos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-actions/setup-android@v3 still installs the obsolete "tools" package,
      # which sdkmanager no longer ships. Install the pieces this build actually uses.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project for CI
        run: |
          rm -f local.properties
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      # Every module shares one fixed key. Without it, each runner signs with a fresh
      # debug keystore, so the APK cannot install over the previous build and the user
      # loses the module's LSPosed scope. Missing secret = fail, never fall back.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.XVC_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::XVC_KEYSTORE_B64 secret is missing; refusing to build an APK that cannot be upgraded in place"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # A green test task with zero executed tests proves nothing: the settings write
      # path silently doing nothing is exactly the failure this suite must catch.
      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          python3 - app/build/test-results/testDebugUnitTest <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob(sys.argv[1] + "/*.xml"))
          if not files:
              sys.exit("no test result XML found")
          total = failed = 0
          for f in files:
              r = ET.parse(f).getroot()
              t = int(r.get("tests")); bad = int(r.get("failures")) + int(r.get("errors"))
              total += t; failed += bad
              print(f"{r.get('name')}: tests={t} failures={bad}")
          print(f"TOTAL tests={total} failures={failed}")
          if total == 0:
              sys.exit("zero tests executed")
          if failed:
              sys.exit(f"{failed} test failure(s)")
          PY

      - name: Build debug APK
        env:
          PGP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PGP_KEYSTORE_PASSWORD: ${{ secrets.XVC_KEYSTORE_PASSWORD }}
          PGP_KEY_ALIAS: ${{ secrets.XVC_KEY_ALIAS }}
          PGP_KEY_PASSWORD: ${{ secrets.XVC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify artifact contract (shared gate)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          bash "$GITHUB_WORKSPACE/tools/verify_lsp_artifact.sh" \
            "$APK" balti.xposed.pixelifygooglephotos.PixelifyModule \
            com.google.android.apps.photos \
            app/build/test-results/testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelify-google-photos-debug-apk
          path: projects/pixelify-google-photos/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixelify-google-photos-${{ github.run_number }}
          files: projects/pixelify-google-photos/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
