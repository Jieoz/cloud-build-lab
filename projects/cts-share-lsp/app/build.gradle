plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.jieoz.ctsshare"
    compileSdk 35

    defaultConfig {
        applicationId "com.jieoz.ctsshare"
        minSdk 30
        targetSdk 35
        versionCode 8
        versionName "0.2.6"
    }

    def keystorePath = System.getenv("PGP_KEYSTORE_PATH")
    def keystorePass = System.getenv("PGP_KEYSTORE_PASSWORD")
    def keyAliasName = System.getenv("PGP_KEY_ALIAS") ?: "pgp"
    def keyPassword = System.getenv("PGP_KEY_PASSWORD") ?: keystorePass
    def hasFixedKey = keystorePath && file(keystorePath).exists() && keystorePass

    signingConfigs {
        if (hasFixedKey) {
            fixed {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias keyAliasName
                it.keyPassword = keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // R8 strips unused Kotlin stdlib; the module code itself is kept whole (see proguard-rules.pro).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasFixedKey) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasFixedKey) signingConfig signingConfigs.fixed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Provided by LSPosed 2.x at runtime. Packaging it collides with the framework copy.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // XposedService: app-side remote-prefs write channel for the log switch (same as siblings).
    implementation files('libs/libxposed-service-102.0.0.aar')
    implementation files('libs/libxposed-interface-102.0.0.aar')
}
